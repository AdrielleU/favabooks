services:
  favabooks:
    # Published image. "0.4" follows 0.4.x patches: docker compose pull && docker compose up -d
    # Pin an exact release (0.4.0) or use "latest". To build from source instead:
    #   docker compose -f compose.yaml -f compose.build.yaml up -d --build
    image: ghcr.io/adrielleu/favabooks:${FAVABOOKS_TAG:-0.4}
    # AI assistants run commands in it by this name (see the books' AGENTS.md)
    container_name: favabooks
    restart: unless-stopped
    environment:
      # space-separated list: one main.beancount per entity
      LEDGERS: "/books/my-company/main.beancount"
      # Create the books on first run: blank (default), demo or none
      FAVABOOKS_STARTER: "none"
      GIT_AUTHOR_NAME: "favabooks"
      GIT_AUTHOR_EMAIL: "favabooks@localhost"
      GIT_COMMITTER_NAME: "favabooks"
      GIT_COMMITTER_EMAIL: "favabooks@localhost"
      # Where the books are on this machine, for the "Add your files" popup
      FAVABOOKS_HOST_BOOKS: "/srv/books"
      # Fava runs import-config with runpy, so siblings of config.py need this
      PYTHONPATH: "/books/importers"
    # rootless Podman only: map host UID to the container's fava user
    # userns_mode: keep-id
    volumes:
      - /srv/books:/books # the books/ git repo from Step 5
    ports:
      - "127.0.0.1:5000:5000" # only reachable through the reverse proxy
