services:
  favabooks:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: favabooks:latest
    restart: unless-stopped
    environment:
      # space-separated list: one main.beancount per entity
      LEDGERS: "/books/my-company/main.beancount"
      GIT_AUTHOR_NAME: "favabooks"
      GIT_AUTHOR_EMAIL: "favabooks@localhost"
      GIT_COMMITTER_NAME: "favabooks"
      GIT_COMMITTER_EMAIL: "favabooks@localhost"
      # Fava runs import-config with runpy, so siblings of config.py need this
      PYTHONPATH: "/books/importers"
    # rootless Podman only: map host UID to the container's fava user
    # userns_mode: keep-id
    volumes:
      - /srv/books:/books # the books/ git repo from Step 5
    ports:
      - "127.0.0.1:5000:5000" # only reachable through the reverse proxy
