# Favabooks, self-hosted: Beancount, Fava and the Favabooks UI in one image.
#
#   mkdir books              # your books live here, as plain files
#   docker compose up -d     # then open http://localhost:5000
#
# On first run it creates new books in ./books: a starter chart of accounts
# (FAVABOOKS_STARTER=blank) or the fictional demo company (demo).
# Update later with: docker compose pull && docker compose up -d
#
# Fava has no login. Keep the port on 127.0.0.1 (this computer only) or put
# Favabooks behind a reverse proxy with a login before exposing it; see
# docker/compose.yaml for a production setup.
services:
  favabooks:
    image: ghcr.io/adrielleu/favabooks:${FAVABOOKS_TAG:-latest}
    container_name: favabooks
    restart: unless-stopped
    environment:
      # Your company name, used when new (blank) books are created
      FAVABOOKS_COMPANY: "${FAVABOOKS_COMPANY:-My Company LLC}"
      # What to create on first run: blank, demo or none
      FAVABOOKS_STARTER: "${FAVABOOKS_STARTER:-blank}"
      # Space-separated main.beancount files, one per company
      LEDGERS: "/books/main.beancount"
      # Bank & card account settings and import scripts live here
      PYTHONPATH: "/books/importers"
      # Who saves from the UI are recorded as, if ./books is a git repo
      GIT_AUTHOR_NAME: "favabooks"
      GIT_AUTHOR_EMAIL: "favabooks@localhost"
      GIT_COMMITTER_NAME: "favabooks"
      GIT_COMMITTER_EMAIL: "favabooks@localhost"
    # The container runs as user 1000. If your user id differs, either
    # chown ./books to 1000 or uncomment this (Linux):
    # user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./books:/books
    ports:
      # This computer only. To reach it from other devices on your network,
      # use "5000:5000" (anyone on the network can then open your books).
      - "127.0.0.1:${FAVABOOKS_PORT:-5000}:5000"
