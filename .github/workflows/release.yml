# Favabooks release: push a tag like v0.1.0 to publish
#   - the Docker image  ghcr.io/<owner>/favabooks:{0.1.0, 0.1, latest}
#   - a GitHub Release with the wheel attached
# Credentials: only the built-in GITHUB_TOKEN. Nothing is published to PyPI.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  wheel:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs reads the version from the tag
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          package-manager-cache: false
      - run: cd frontend && npm ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv build --wheel
      - name: Check the wheel version matches the tag
        run: ls dist/fava-"${GITHUB_REF_NAME#v}"-py3-none-any.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: dist/*.whl

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(-t "$image:$version")
          # Pre-releases (v1.2.0-rc.1) don't move the floating tags.
          if [[ "$version" != *-* ]]; then
            tags+=(-t "$image:${version%.*}" -t "$image:latest")
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f docker/Dockerfile --build-arg "VERSION=$version" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.description=Favabooks: QuickBooks-like UI for Beancount, a fork of Fava" \
            "${tags[@]}" .
          docker push --all-tags "$image"

  release:
    needs: [wheel, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: dist
      - name: Create the GitHub Release (or add the wheel to an existing one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl --verify-tag \
              --title "Favabooks ${GITHUB_REF_NAME#v}" --generate-notes "${prerelease[@]}"
          fi
