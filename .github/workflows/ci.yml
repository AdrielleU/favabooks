# Favabooks CI. Replaces Fava's test.yml, docs-pages.yml and publish.yml
# (deleted in this fork); if an upstream merge brings them back, `git rm` them.
name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-py:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported (pyproject requires-python) and newest.
        py: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.py }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: touch src/fava/static/app.js
      # Fails under 100% coverage, including src/fava/qb_api.py.
      - run: make test-py

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - run: make frontend/node_modules
      - run: cd frontend && npm run build
      - run: cd frontend && npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: make frontend/node_modules
      - run: uv run --no-dev --group pre-commit prek run -a
      - run: cd frontend && npx tsc
      - run: cd frontend && npx svelte-check
      - run: touch src/fava/static/app.js
      - run: make mypy

  # Package updates: uv.lock in sync with pyproject.toml (the Docker image
  # installs exactly it) and no known vulnerabilities in Python or npm
  # packages. The weekly Upstream workflow reports updates that are due.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: make frontend/node_modules
      - run: sh contrib/check_packages.sh --ci packages.md
      - if: always()
        run: cat packages.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build only; release.yml pushes images. Fails if uv.lock is stale.
      - run: docker build -f docker/Dockerfile --build-arg VERSION=0.0.0+ci .
